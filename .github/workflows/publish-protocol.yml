name: publish-protocol

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'protocol-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - name: Verify release tag
        working-directory: packages/galaxea-a1-runtime-protocol
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "protocol-v${VERSION}"
      - run: python -m build
        working-directory: packages/galaxea-a1-runtime-protocol
      - run: twine check dist/*
        working-directory: packages/galaxea-a1-runtime-protocol
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-dist
          path: packages/galaxea-a1-runtime-protocol/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-protocol
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: protocol-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
