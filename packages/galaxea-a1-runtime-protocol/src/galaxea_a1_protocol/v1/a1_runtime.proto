syntax = "proto3";

package lerobot_robot_galaxea_a1.runtime.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

service A1RuntimeService {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Heartbeat(SessionRequest) returns (google.protobuf.Empty);
  rpc Observe(SessionRequest) returns (ValuesResponse);
  rpc Command(CommandRequest) returns (ValuesResponse);
  rpc Health(SessionRequest) returns (HealthResponse);
  rpc Close(SessionRequest) returns (google.protobuf.Empty);
}

enum SessionMode {
  SESSION_MODE_UNSPECIFIED = 0;
  SESSION_MODE_OBSERVE = 1;
  SESSION_MODE_COMMAND = 2;
}

message DescribeRequest {
  uint32 protocol_version = 1;
}

message DescribeResponse {
  uint32 protocol_version = 1;
  RuntimeManifest manifest = 2;
}

message OpenRequest {
  uint32 protocol_version = 1;
  SessionMode mode = 2;
  string client_name = 3;
  string client_version = 4;
}

message OpenResponse {
  string session_id = 1;
  uint64 lease_timeout_ms = 2;
  RuntimeManifest manifest = 3;
  uint64 command_timeout_ms = 4;
}

message SessionRequest {
  string session_id = 1;
}

message CommandRequest {
  string session_id = 1;
  uint64 sequence = 2;
  uint64 sent_monotonic_ns = 3;
  repeated FeatureValue values = 4;
}

message ValuesResponse {
  repeated FeatureValue values = 1;
}

message FeatureValue {
  string name = 1;
  double scalar = 2;
}

message RuntimeManifest {
  uint32 api_version = 1;
  string identifier = 2;
  repeated FeatureSpec observation_features = 3;
  repeated FeatureSpec action_features = 4;
  map<string, string> metadata = 5;
}

message FeatureSpec {
  string name = 1;
  optional string unit = 2;
  optional double minimum = 3;
  optional double maximum = 4;
}

message HealthResponse {
  string status = 1;
  string summary = 2;
  google.protobuf.Struct details = 3;
}
