# Distill-WAM A1 release: kitchen students/teachers, Flash-WAM baselines.
#
# One-shot registration for a family that shares one pinned Hugging Face
# revision and folder layout. Generated descriptors, manifests, contracts, and
# deployments are create-only; rerunning verifies instead of overwriting.
#
#   just model-register-release configs/releases/distill_wam_a1_20260922.toml \
#       --from-local models/Distill-WAM
#
# Ports take the table value plus the model order below. Keep both ranges free
# of every other tracked deployment.

[release]
schema_version = 1
id = "distill-wam-a1-20260922"

[source]
provider = "huggingface"
repo_id = "SeanZheng/Distill-WAM"
revision = "0507667b5d4428c5c5478acefa6106389a61709b"
revision_label = "a1-kitchen-and-flashwam"

[ports]
server = 1130
master = 29600

[[model]]
key = "kitchen_pour_water_student"
id = "diffusion2one/a1_kitchen_pour_water_eef"
directory = "galaxea-a1-kitchen-pour-water"
checkpoint_step = 1000
kind = "student"
catalog = "configs/tasks/kitchen_pour_water/catalog.json"

[[model]]
key = "kitchen_pour_water_teacher"
id = "diffusion2one/a1_kitchen_pour_water_teacher_eef"
directory = "galaxea-a1-kitchen-pour-water-teacher"
checkpoint_step = 1000
kind = "teacher"
catalog = "configs/tasks/kitchen_pour_water/catalog.json"

[[model]]
key = "kitchen_pour_water_flashwam_step250"
id = "diffusion2one/a1_kitchen_pour_water_flashwam_step250_eef"
directory = "galaxea-a1-kitchen-pour-water-flashwam-step250"
checkpoint_step = 250
kind = "student"
catalog = "configs/tasks/kitchen_pour_water/catalog.json"

[[model]]
key = "kitchen_no_memory_student"
id = "diffusion2one/a1_kitchen_no_memory_eef"
directory = "galaxea-a1-kitchen-no-memory"
checkpoint_step = 1000
kind = "student"
catalog = "configs/tasks/kitchen_no_memory/catalog.json"

[[model]]
key = "kitchen_no_memory_teacher"
id = "diffusion2one/a1_kitchen_no_memory_teacher_eef"
directory = "galaxea-a1-kitchen-no-memory-teacher"
checkpoint_step = 1000
kind = "teacher"
catalog = "configs/tasks/kitchen_no_memory/catalog.json"

[[model]]
key = "kitchen_no_memory_flashwam_step250"
id = "diffusion2one/a1_kitchen_no_memory_flashwam_step250_eef"
directory = "galaxea-a1-kitchen-no-memory-flashwam-step250"
checkpoint_step = 250
kind = "student"
catalog = "configs/tasks/kitchen_no_memory/catalog.json"

[[model]]
