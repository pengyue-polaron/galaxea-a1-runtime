[system]
config = "configs/system/a1.toml"

[backend]
config = "configs/inference/backends/lingbot_va.toml"

[model]
config = "configs/models/lingbot/plug_insertion_eef.toml"

[tasks]
config = "configs/tasks/lingbot/plug_insertion_step500/catalog.json"

[deployment]
id = "lingbot-plug-insertion-eef"
ready = true

[session]
master_port = 29501
startup_timeout_s = 300.0
shutdown_timeout_s = 10.0

[server]
host = "127.0.0.1"
port = 1106
connect_timeout_s = 2.0
close_timeout_s = 10.0

[observations]
front_key = "observation.images.front"
wrist_key = "observation.images.wrist"

[execution]
execute = true
max_model_calls = 286
ik_replan_max_attempts = 0
execute_frames = 1
kv_observations_per_frame = 4
exec_rate = 30.0
print_actions = false
review_deadband_m = 0.001

[execution.ik_subgoal]
enabled = false

# Wait before collecting the final history image of each executed chunk.
[execution.settle]
enabled = false

[recording]
camera_videos_enabled = true
output_root = "outputs/inference/lingbot-plug-insertion-eef/recordings"
