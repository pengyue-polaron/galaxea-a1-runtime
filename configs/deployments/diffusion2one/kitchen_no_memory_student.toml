[system]
config = "configs/system/a1.toml"

[backend]
config = "configs/inference/backends/diffusion2one.toml"

[model]
config = "configs/models/diffusion2one/kitchen_no_memory_student.toml"

[tasks]
config = "configs/tasks/kitchen_no_memory/catalog.json"

[deployment]
id = "diffusion2one-kitchen-no-memory-student"
ready = true

[session]
master_port = 29603
startup_timeout_s = 300.0
shutdown_timeout_s = 10.0

[server]
host = "127.0.0.1"
port = 1133
connect_timeout_s = 2.0
close_timeout_s = 10.0

[observations]
front_key = "observation.images.front"
wrist_key = "observation.images.wrist"

[execution]
execute = true
max_model_calls = 132
# Consecutive retries; a completed chunk replenishes the budget.
ik_replan_max_attempts = 3
# Four actions per model frame: re-observe after eight executed actions.
execute_frames = 2
kv_observations_per_frame = 4
exec_rate = 30.0
print_actions = false
review_deadband_m = 0.001

[execution.ik_subgoal]
enabled = true
max_attempts = 5
max_translation_m = 0.01
max_rotation_rad = 0.05
max_joint_delta_rad = 0.05
feedback_timeout_s = 2.0

# Wait before collecting the final history image of each executed chunk.
[execution.settle]
enabled = true
min_wait_s = 4.0
stable_window_s = 0.3
timeout_s = 8.0
joint_range_rad = 0.01
gripper_range = 0.02

[recording]
camera_videos_enabled = true
output_root = "outputs/inference/diffusion2one-kitchen-no-memory-student/recordings"
