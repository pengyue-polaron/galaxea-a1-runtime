[host]
image = "galaxea-a1-runtime/a1-noetic-arm64:local"
a1_serial = "/dev/a1"

[topics]
joint_states = "/joint_states_host"
joint_target = "/arm_joint_target_position"
staged_command = "/arm_joint_command_a1_staged"
host_command = "/arm_joint_command_host"
motor_status = "/arm_status_host"
motion_enable = "/a1_arm_motion_enable"
relay_status = "/a1_arm_relay_status"
gripper_target = "/a1_gripper_target"
gripper_command = "/gripper_position_control_host"
gripper_feedback = "/gripper_stroke_host"
eef_pose = "/end_effector_pose"
eef_target = "/a1_ee_target"

[relay]
rate_hz = 100.0
status_rate_hz = 5.0
enable_timeout_s = 2.0
max_status_age_s = 1.0
max_input_age_s = 0.25
arming_timeout_s = 1.0
# Gripper bit 3: Position Jump compatibility exception.
gripper_ignored_error_mask = 8
# Mode 0 = MIT control.
allowed_control_modes = [0]

[doctor]
ros_topic_timeout_s = 1.5

[startup]
ros_master_timeout_s = 10.0
joint_feedback_timeout_s = 20.0
topic_timeout_s = 15.0
tmux_process_grace_s = 4

[robot_service]
endpoint = "unix:///tmp/galaxea-a1-runtime/robot-service.sock"
device_connect_timeout_s = 30.0
rpc_timeout_s = 0.5
command_timeout_s = 0.75
lease_timeout_s = 1.0
server_startup_timeout_s = 5.0
server_shutdown_timeout_s = 5.0

[joint_safety]
names = ["arm_joint1", "arm_joint2", "arm_joint3", "arm_joint4", "arm_joint5", "arm_joint6"]
lower_limits = [-2.8798, -0.1, -3.3161, -2.8798, -1.6581, -2.8798]
upper_limits = [2.8798, 3.2289, 0, 2.8798, 1.6581, 2.8798]
initial_alignment_tolerance_rad = 0.05
state_timeout_s = 10.0
max_feedback_age_s = 0.5

[eef]
# Operator-adjusted 2026-09-10; arm_seg6 in base_link, meters (X, Y, Z).
xyz_min = [-0.3, -0.8, -0.2]
xyz_max = [0.8, 0.8, 1]
workspace_policy = "clip"
min_quat_norm = 0.25
max_feedback_age_s = 0.5
feedback_wait_timeout_s = 5.0

[eef_ik]
backend = "trac_ik"
urdf = "third_party/A1_SDK/install/share/mobiman/urdf/A1/urdf/A1_URDF_0607_0028.urdf"
max_iterations = 400
damping = 0.01
orientation_weight = 0.2
max_iteration_step_rad = 0.08
position_tolerance_m = 0.003
orientation_tolerance_rad = 0.02
max_solution_delta_rad = 1.70

[eef_ik.trac_ik]
# Distance mode; isolated upstream library, no ROS node or hardware access.
binary = ".cache/trac_ik/a1_trac_ik"
base_link = "base_link"
tip_link = "arm_seg6"
timeout_s = 0.01
epsilon = 0.00001
rpc_timeout_s = 1.0
startup_timeout_s = 10.0

[eef_ik.constrained]
# Hard Cartesian norm constraints; soft preference for joint-limit clearance.
limit_margin_rad = 0.25
limit_weight = 0.1
# Numerical reserve inside the unchanged System arrival tolerances.
tolerance_scale = 0.99
optimizer_tolerance = 0.000000001
timeout_s = 0.5

[eef_test]
step_m = 0.03
settle_s = 1.0

[gripper]
stroke_min_mm = 0.0
stroke_max_mm = 104.0
# Absorbs the model quantile de-normalization endpoint roundoff.
normalized_endpoint_tolerance = 0.000002

[cameras]
warmup_frames = 20
max_age_s = 0.5
max_pair_skew_s = 0.1

[cameras.front]
backend = "realsense"
serial = "341522300456"
width = 640
height = 480
fps = 30
require_usb3 = false
# Depth requires depth_width, depth_height, and align_depth_to_color.
depth = false
# Manual exposure/gain and white_balance require auto=false.
auto_exposure = true
auto_white_balance = true
crop_enabled = true
crop_x = 103
crop_y = 0
crop_width = 480
crop_height = 480

[cameras.wrist]
backend = "realsense"
serial = "218622276998"
width = 640
height = 480
fps = 30
require_usb3 = false
auto_exposure = true
auto_white_balance = true
crop_enabled = false

[camera_diagnostics]
output_root = "outputs/camera_diagnostics"
frame_timeout_s = 5.0
rate_probe_s = 2.0
jpeg_quality = 95

[web_preview]
enabled = true
bind = "0.0.0.0"
port = 8088
fps = 10.0
jpeg_quality = 75
startup_timeout_s = 15.0
shutdown_timeout_s = 5.0

[observability]
enabled = true
bind = "0.0.0.0"
port = 8766
image_rate_hz = 8.0
jpeg_quality = 75
diagnostics_rate_hz = 5.0
operator_panel_poll_rate_hz = 2.0
operator_session_timeout_s = 0.25
camera_connect_timeout_s = 1.0
camera_retry_s = 2.0
startup_timeout_s = 15.0
shutdown_timeout_s = 5.0
graph_update_ms = 1000
send_buffer_limit_bytes = 10000000

[observability.topics]
front_image = "/a1/telemetry/cameras/front/image/compressed"
wrist_image = "/a1/telemetry/cameras/wrist/image/compressed"
staged_joint_state = "/a1/telemetry/joints/staged"
host_joint_state = "/a1/telemetry/joints/forwarded"
gripper_feedback_state = "/a1/telemetry/gripper/measured_mm"
gripper_target_state = "/a1/telemetry/gripper/target_mm"
gripper_command_state = "/a1/telemetry/gripper/forwarded_mm"
workflow_status = "/a1/ops/workflow_status"
diagnostics = "/a1/diagnostics"

[operator_panel]
# Trusted LAN only; no user authentication or TLS.
bind = "0.0.0.0"
port = 8765
control_enabled = true

[operator_panel.services]
start = "/a1/ops/collection/start"
save = "/a1/ops/collection/save"
save_without_reset = "/a1/ops/collection/save_without_reset"
enable_reset_after_save = "/a1/ops/collection/reset_after_save/enable"
disable_reset_after_save = "/a1/ops/collection/reset_after_save/disable"
discard = "/a1/ops/collection/discard"
reset = "/a1/ops/collection/reset"
stop = "/a1/ops/collection/stop"
