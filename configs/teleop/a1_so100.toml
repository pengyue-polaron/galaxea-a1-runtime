[system]
config = "configs/system/a1.toml"

[runtime]
bridge_startup_timeout_s = 65.0
bridge_stop_timeout_s = 5.0

[reset]
config = "configs/poses/a1_so100_collection_start.toml"

[leader]
port = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A016967-if00"
id = "my_leader"
motor_write_retries = 5

[bridge]
hz = 60.0
scale = [1, 1, 1, 1, 1, 1]
sign = [-1, 1, 1, -1, 1, -1]
bias_rad = [0, 0, 0, 0, 0, 0]
max_joint_action_step_rad = 0.35

[gripper]
source_min = 0.0
# Measured SO leader open endpoint; maps to normalized 1.0.
source_max = 53.16
invert = false
saturate_out_of_range = true

[collection]
dataset_root = "data/datasets"
repo_id_prefix = "pengyue-polaron/galaxea-a1"
fps = 30.0
max_duration_s = 0.0
auto_reset_before_collection = true
auto_reset_after_save = true
auto_reset_after_discard = true
ready_timeout_s = 10.0

[collection.leading_stillness]
enabled = true
# Six joint angles in radians, then normalized gripper.
action_thresholds = [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02]
reference_frames = 3
motion_frames = 3
preroll_frames = 6
